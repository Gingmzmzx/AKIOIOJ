{% extends "layout/immersive.html" %}
{% block content %}
<div class="row"><div class="columns">
  <div class="immersive--content immersive--center">
    <h1>{{ _('Login') }}</h1>
    {% if oauth_error %}
    <div class="alert alert--danger">
      <p>{{ _('Authorization denied or failed. Please try again.') }}</p>
    </div>
    {% endif %}
    <div class="row"><div class="columns">
      <div class="text-center">
        <a href="{{ reverse_url('user_login') }}" class="inverse expanded rounded primary button">
          {{ _('Login with NetEssX') }}
        </a>
      </div>
    </div></div>
  </div>
</div></div>
{% endblock %}
